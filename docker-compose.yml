# Uso: docker compose up -d   (luego abrir http://localhost:8000)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: curricular
      POSTGRES_USER: curricular
      POSTGRES_PASSWORD: cambiar-esta-clave
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    restart: unless-stopped

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://curricular:cambiar-esta-clave@db:5432/curricular
      SECRET_KEY: cambiar-por-una-clave-larga-y-secreta
      ALLOWED_HOSTS: localhost,127.0.0.1
      COOKIES_SEGURAS: "false"   # poner "true" cuando se sirva con HTTPS
    depends_on:
      - db
    restart: unless-stopped

volumes:
  datos_postgres:
