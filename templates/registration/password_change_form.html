{% extends "base.html" %}
{% block titulo %}Cambiar contraseña{% endblock %}
{% block contenido %}
<div class="row justify-content-center"><div class="col-md-5"><div class="card p-4">
  <h4>Cambiar contraseña</h4>
  <form method="post">{% csrf_token %}
    {% for f in form %}<div class="mb-3"><label class="form-label">{{ f.label }}</label>
      <input type="password" name="{{ f.html_name }}" class="form-control" required>
      {% for e in f.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
      {% if f.help_text %}<div class="form-text small">{{ f.help_text|safe }}</div>{% endif %}</div>{% endfor %}
    <button class="btn btn-primary">Guardar</button>
  </form>
</div></div></div>
{% endblock %}
